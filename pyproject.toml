[project]
name = "stubscan"
version = "0.2.0"
description = "Detect fabricated data and fake hashes in TS/JS/Python source."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ast = [
  "tree-sitter>=0.22",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-javascript>=0.21",
]
dev = ["pytest>=8"]

[project.scripts]
stubscan = "stubscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
